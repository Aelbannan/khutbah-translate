[project]
name = "khutbah"
version = "0.1.0"
description = "Live khutbah captions: Arabic/English speech to English and Chinese"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "rapidfuzz>=3.14.6",
    "sherpa-onnx>=2.0.3",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
khutbah-server = "khutbah.server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
