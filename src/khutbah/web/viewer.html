<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khutbah captions</title>
<link rel="stylesheet" href="/static/viewer.css">
</head>
<body>
<header>
  <span id="title">Khutbah</span>
  <span id="state" class="off">offline</span>
  <span class="spacer"></span>
  <label>Language

      <option value="both">English + 中文</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>

</header>
<main>
  <section id="captions" aria-live="polite"></section>
  <aside id="cards"></aside>
</main>
<footer id="hearing"></footer>
<script src="/static/viewer.js"></script>
</body>
</html>
